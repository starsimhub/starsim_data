name: Publish

# Publishes the package to PyPI when a `v*` release is published (e.g. `v2.0.0`), by
# trusted publishing (no token; set up once on pypi.org). Make the release with
# `python scripts/pypi_release.py <data tag>`, which also creates the data release the
# fetched stores are downloaded from. This refuses to publish a package whose fetched
# stores can't be downloaded.

on:
  release:
    types: [published]

jobs:
  pypi:
    name: Publish to PyPI
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@master
        with:
          python-version: '3.14'
      - name: Check the version matches the tag, and the fetched stores can be downloaded
        run: |
          python - <<'EOF'
          import json, pathlib, re, urllib.request
          tag = '${{ github.event.release.tag_name }}'
          version = re.search(r"__version__ = '(.+)'", pathlib.Path('starsim_data/version.py').read_text())[1]
          assert tag == f'v{version}', f'Tag {tag} does not match version {version}'
          manifest = json.loads(pathlib.Path('starsim_data/data/fetched.json').read_text())
          for name, entry in manifest.items():
              with urllib.request.urlopen(urllib.request.Request(entry['url'], method='HEAD')) as response:
                  assert response.status == 200, f'{name}: {entry["url"]} returned {response.status}'
          print(f'Version {version}; {len(manifest)} fetched stores are downloadable')
          EOF
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

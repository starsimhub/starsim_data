name: starsim_data CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  install_and_test:
    name: Tests
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@master
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install starsim_data
        run: pip install -e .[dev]
      - name: Run tests
        # -m "not network" so the suite stays offline by default; the bundled data
        # makes every core test hermetic, and that property is worth protecting.
        run: pytest tests -v -m "not network" --durations=0 --junitxml=test-results.xml
      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: './test-results.xml'
          check_name: 'Test Report (Python ${{ matrix.python-version }})'

  check_data_is_reproducible:
    name: Data rebuild is reproducible
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@master
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install starsim_data
        run: pip install -e .[dev]
      # The bundled .h5 stores are build artifacts committed to the repo, so they can
      # drift from the raw data they claim to be built from. Rebuilding and validating
      # here is what keeps `raw_data/` the actual source of truth.
      - name: Rebuild contact matrices and validate against the CSVs
        run: python scripts/build_hdf5.py --check
      - name: Rebuild demographics and validate via the loader
        run: python scripts/build_demographics.py --check
      - name: Check locations.csv is up to date
        run: python scripts/build_locations.py --check
      - name: Tests still pass against the rebuilt data
        run: pytest tests -q -m "not network"

  # The node table is deliberately left out of the job above: rebuilding it pulls ~420 MB
  # of boundary data from GitHub, which is too much to spend on every pull request. Run it
  # by hand when the boundary sources change.
  check_nodes_are_reproducible:
    name: Node table rebuild is reproducible
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@master
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install starsim_data
        run: pip install -e .[dev,spatial]
      - name: Rebuild the node table and validate via the loader
        run: python scripts/build_nodes.py --check
      - name: Tests still pass against the rebuilt node table
        run: pytest tests -q -m "not network"

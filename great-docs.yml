# Great Docs configuration for starsim_data.
# https://posit-dev.github.io/great-docs/user-guide/configuration.html
#
# Build with:   great-docs build       (output in great-docs/_site/, gitignored)
# Preview with: great-docs preview
#
# Narrative pages live in docs/. The README is not used for the site -- it remains the
# front door on GitHub and PyPI -- because the first User Guide page is the landing page
# instead (see `homepage` below).

parser: google

# starsim_data's modules do `import starsim_data as ssd` (Starsim's convention), which
# reads as a cyclic alias to the dynamic introspector. Static analysis handles it fine.
dynamic: false

# One User Guide rather than navbar sections, and the first page of it as the landing
# page. This is what lets the same grouped sidebar appear on every page including the
# landing page, with no custom navigation code: great-docs offers either navbar sections
# or a sidebar on the landing page, and the sidebar is the more useful of the two.
# Pages are ordered by filename prefix and grouped by their `guide-section` frontmatter.
#
# One consequence to know about: the landing page renders at the site root while its
# siblings render under user-guide/, so cross-page links in docs/01-getting-started.qmd
# carry a `user-guide/` prefix. Every other page links to plain siblings.
user_guide: docs
homepage: user_guide

site_url: "https://starsimhub.github.io/starsim_data/"

# Match the Starsim documentation (https://docs.starsim.org): cosmo, with the page's own
# headings expanded in the margin rather than collapsed.
site:
  theme: cosmo
  toc: true
  toc-expand: true
  toc-depth: 4

# The Starsim icon plus this package's own name, rather than the full Starsim wordmark:
# this belongs to the Starsim family, but it is not Starsim. The icons are cropped from
# docs/assets/logo.png, the wordmark the other Starsim sites use.
logo:
  light: docs/assets/icon.png
  dark: docs/assets/icon-dark.png
  show_title: true
display_name: Starsim Data

# The landing page is a guide page, so it opens with its own heading rather than a hero
# block. (It also avoids a bug in great-docs 0.16.0, whose `homepage: user_guide` hero
# emits an invalid raw-HTML fence that makes the whole page render as literal text.)
hero: false
favicon: docs/assets/favicon.ico

jupyter: python3

authors:
  - name: Starsim Development Team
    role: Author
    email: info@starsim.org
    homepage: https://starsim.org
  - name: Cliff Kerr
    role: Author
  - name: Romesh Abeysuriya
    role: Author
  - name: Robyn Stuart
    role: Author

funding:
  name: "Gates Foundation"
  roles:
    - funder
  homepage: https://www.gatesfoundation.org

# A few small style overrides great-docs has no setting for: figure scaling, navbar
# centering, the authorship badge, and the Starsim footer.
include_in_header:
  - file: docs/assets/starsim-theme.html

# Each page's `authorship` frontmatter is shown as a badge at the top right, as on the
# Starsim site. great-docs has no setting for a Quarto filter, so this script adds
# docs/assets/authorship.lua to the generated _quarto.yml before rendering.
pre_render: docs/assets/authorship.py

# The changelog is CHANGELOG.md, included by docs/11-changelog.qmd, rather than the page
# great-docs generates from GitHub Releases: the releases here are data assets, not notes.
changelog:
  enabled: false

# `title` only: with no `contents` or `sections`, great-docs discovers the public API
# itself and groups it by type, so there is no symbol list to keep in step with the code.
reference:
  title: API

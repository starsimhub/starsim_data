# Great Docs configuration for starsim_data.
# https://posit-dev.github.io/great-docs/user-guide/configuration.html
#
# Build with:   great-docs build       (output in great-docs/_site/, gitignored)
# Preview with: great-docs preview
#
# Narrative pages live in docs/ and are ordered by their filename prefix; the homepage is
# generated from README.md, so the README stays the single front door for GitHub, PyPI
# and the docs site alike.

parser: google

# starsim_data's modules do `import starsim_data as ssd` (Starsim's convention), which
# reads as a cyclic alias to the dynamic introspector. Static analysis handles it fine.
dynamic: false

# Three sections rather than one User Guide, so the navbar carries the top-level
# structure the way the Starsim docs do: Home | Getting started | The data | Internals |
# Reference. Pages within a section are ordered by their filename prefix, which is
# stripped from the URL.
sections:
  - title: Getting started
    dir: docs/start
  - title: The data
    dir: docs/data
    navbar_after: Getting started
  - title: Internals
    dir: docs/internals
    navbar_after: The data

site_url: "https://starsimhub.github.io/starsim_data/"

# Match the Starsim documentation (https://docs.starsim.org): cosmo, with the page's own
# headings expanded in the margin rather than collapsed.
site:
  theme: cosmo
  toc: true
  toc-expand: true
  toc-depth: 4

# The Starsim icon plus this package's own name, rather than the full Starsim wordmark:
# this belongs to the Starsim family, but it is not Starsim. The icons are cropped from
# docs/assets/logo.png, the wordmark the other Starsim sites use.
logo:
  light: docs/assets/icon.png
  dark: docs/assets/icon-dark.png
  show_title: true
display_name: Starsim Data
favicon: docs/assets/favicon.ico

jupyter: python3

authors:
  - name: Starsim Development Team
    role: Author
    email: info@starsim.org
    homepage: https://starsim.org
  - name: Cliff Kerr
    role: Author
  - name: Romesh Abeysuriya
    role: Author
  - name: Robyn Stuart
    role: Author

funding:
  name: "Gates Foundation"
  roles:
    - funder
  homepage: https://www.gatesfoundation.org


reference:
  - title: Loading bundled data
    desc: >
      Tier 0: everything inside the wheel. These never touch the network.
    contents:
      - load
      - list_datasets
      - list_locations
      - list_revisions
      - provenance

  - title: Locations
    desc: >
      Turning whatever a user typed into a canonical key, and the vocabulary for
      administrative levels.
    contents:
      - resolve
      - location_info
      - list_all_locations
      - parse_level

  - title: The node table
    desc: >
      Bundled subnational geography: where each administrative unit is, how big it is, and
      how far apart they are. No geospatial dependencies needed.
    contents:
      - load_nodes
      - distances
      - node_name

  - title: Fetching UN WPP data
    desc: >
      Tier 2: annual series, complete life tables and other projection variants,
      downloaded on demand and cached.
    contents:
      - fetch
      - list_fetchable

  - title: Boundaries
    desc: >
      Administrative boundaries with full geometry, from UNOCHA, geoBoundaries or GADM.
      Requires the [spatial] extra.
    contents:
      - fetch_shapes
      - list_shape_sources

  - title: Gridded population
    desc: >
      WorldPop rasters and their aggregation onto administrative units, which is what
      turns a boundary file into a metapopulation. Requires the [spatial] extra.
    contents:
      - fetch_nodes
      - fetch_raster
      - aggregate_raster
      - rescale_to_national

  - title: Plotting
    desc: >
      Validation figures: the cheapest way to notice the wrong country or the wrong units.
    contents:
      - plot
      - choropleth

  - title: Cache
    desc: >
      Where downloads go, what is in there, and how to change it.
    contents:
      - cache_dir
      - cache_info
      - cache_provenance
      - cached_download
      - clear_cache

  - title: Settings
    desc: >
      Package-level options, and how to set them.
    contents:
      - options

  - title: The registry
    desc: >
      What datasets exist, how each one is shaped, and the hooks for adding your own.
    contents:
      - registry.Dataset
      - registry.Source
      - registry.datasets
      - registry.dataset
      - register_dataset
      - registry.unregister_dataset
      - register_layout
      - registry.get_layout
      - registry.data_dir
      - registry.refresh

